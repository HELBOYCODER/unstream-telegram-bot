name: 🧪 E2E Pipeline Test

on:
  workflow_dispatch:
    inputs:
      url:
        description: "🔗 Link to test (YouTube, Spotify, etc.)"
        type: string
        default: "https://www.youtube.com/watch?v=xFYQQPAOz7Y"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --no-cache-dir -r requirements.txt

      - name: 🛡️ Launch BgUtils PO-Token Provider (YouTube anti-bot)
        run: |
          echo "Starting BgUtils POT Provider Docker container..."
          docker run --name bgutil-provider -d --init --restart=always \
            -p 127.0.0.1:4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider:latest || true
          
          for i in $(seq 1 15); do
            if curl -s http://127.0.0.1:4416/ping 2>/dev/null || curl -s http://127.0.0.1:4416 2>/dev/null; then
              echo "POT Provider is ready!"
              break
            fi
            sleep 1
          done
          echo "POT_PROVIDER_URL=http://127.0.0.1:4416" >> $GITHUB_ENV
          echo "YTDLP_PLAYER_CLIENTS=mweb,web,ios,tv" >> $GITHUB_ENV

      - name: 🍪 Export YouTube Cookies (if provided)
        env:
          COOKIE_SECRET: ${{ secrets.YTDLP_COOKIES || secrets.YTDLP_COOKIEFILE }}
        run: |
          if [ -n "$COOKIE_SECRET" ]; then
            echo "Writing YouTube cookies..."
            echo "$COOKIE_SECRET" > /tmp/youtube_cookies.txt
            chmod 600 /tmp/youtube_cookies.txt
            echo "YTDLP_COOKIEFILE=/tmp/youtube_cookies.txt" >> $GITHUB_ENV
          fi

      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          POT_PROVIDER_URL: ${{ env.POT_PROVIDER_URL }}
          YTDLP_PLAYER_CLIENTS: ${{ env.YTDLP_PLAYER_CLIENTS }}
          YTDLP_COOKIEFILE: ${{ env.YTDLP_COOKIEFILE }}
        run: python3 -u e2e_test.py "${{ inputs.url }}"
